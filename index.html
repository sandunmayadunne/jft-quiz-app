<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JFT Practice - Sri Lanka</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-box" class="app-container glass-mode">
        
        <!-- Home Screen -->
        <div id="home-screen" class="screen">
            <div class="title-section">
                <h1 class="main-title">Practice</h1>
                <p class="subtitle">අපි ඉගෙන ගත් දේවල් පුහුණු වෙමු 🌸</p>
            </div>
            
            <div class="menu-cards">
                <div class="menu-card" id="btn-aisatsu">
                    <div class="card-icon">🙇‍♂️</div>
                    <h3>ආචාර සමාචාර</h3>
                    <p>Aisatsu ඉගෙන ගමු</p>
                </div>

                <div class="menu-card" id="btn-hiragana">
                    <div class="card-icon">あ</div>
                    <h3>හිරගනා හෝඩිය</h3>
                    <p>Hiragana ඉගෙන ගමු</p>
                </div>
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen hidden">
            <div class="header">
                <div class="header-top">
                    <button id="go-home-btn" class="home-btn">🏠 Home</button>
                    <div id="score-board">ප්‍රශ්නය: <span id="current-q">0</span> / <span id="total">0</span></div>
                </div>
                <h2 id="quiz-title">Quiz</h2>
            </div>

            <div class="question-box">
                <p id="quiz-instruction">උපදෙස්</p>
                <h3 id="question-text">Question loads here</h3>
            </div>

            <div id="options-container" class="options">
            </div>

            <button id="next-btn" class="primary-btn hidden">Next Question ➔</button>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen hidden">
            <h2>Quiz Completed! 🎉</h2>
            <p id="final-score-text"></p>
            <button id="restart-btn" class="primary-btn">Back to Home</button>
        </div>

    </div> <!-- app-container එක මෙතනින් ඉවරයි -->

    <!-- Custom Confirm Modal (app-container එකෙන් එළියට දැම්මා) -->
    <div id="custom-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h3>පිටවෙනවාද?</h3>
            <p id="modal-message">Message goes here</p>
            <div class="modal-buttons">
                <button id="modal-cancel-btn" class="modal-btn cancel-btn">නැහැ</button>
                <button id="modal-ok-btn" class="modal-btn ok-btn">ඔව්</button>
            </div>
        </div>
    </div>

    <!-- Data Files -->
    <script src="aisatsu.js"></script>
    <script src="hiragana.js"></script>
    <!-- Main Logic -->
    <script src="script.js"></script>
</body>
</html>
